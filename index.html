<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="موقعنا المميز - نقدم أفضل الحلول لمساعدة عملك على النمو والنجاح.">
  <title>موقعنا المميز | Our Premium Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <nav>
      <div class="logo" data-en="Your Logo Here">شعارك هنا</div>
      <ul>
        <li><a href="#" data-en="Home">الرئيسية</a></li>
        <li><a href="#services" data-en="Services">خدماتنا</a></li>
        <li><a href="#contact" data-en="Contact Us">اتصل بنا</a></li>
      </ul>
      <div class="language-switcher">
        <button id="langToggle" type="button"
                aria-label="تبديل اللغة / Switch language">English</button>
      </div>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h1 data-en="Welcome to Our Website">أهلاً بك في موقعنا الإلكتروني</h1>
    <p data-en="We provide the best solutions to help your business grow.">
      نحن نقدم أفضل الحلول لمساعدة عملك على النمو والنجاح.
    </p>
    <a href="#contact" class="cta-button" data-en="Get Started">ابدأ الآن</a>
  </section>

  <!-- Services -->
  <section id="services" class="services">
    <h2 data-en="Our Services">خدماتنا</h2>
    <div class="service-cards">
      <div class="card">
        <h3 data-en="Consulting">استشارات</h3>
        <p data-en="Expert advice for your projects.">نصائح الخبراء لمشاريعك.</p>
      </div>
      <div class="card">
        <h3 data-en="Development">تطوير</h3>
        <p data-en="Building modern websites.">بناء مواقع ويب عصرية.</p>
      </div>
      <div class="card">
        <h3 data-en="Support">دعم فني</h3>
        <p data-en="24/7 assistance.">مساعدة على مدار الساعة.</p>
      </div>
    </div>
  </section>

  <!-- Contact -->
  <section id="contact" class="contact">
    <h2 data-en="Contact Us">اتصل بنا</h2>
    <form id="contactForm">
      <label for="name" data-en="Name">الاسم:</label>
      <input type="text" id="name" name="name" required
             placeholder="أدخل اسمك هنا"
             data-en-placeholder="Enter your name here">

      <label for="email" data-en="Email">البريد الإلكتروني:</label>
      <input type="email" id="email" name="email" required
             placeholder="example@mail.com">

      <label for="service" data-en="Interested In">الخدمة المطلوبة:</label>
      <select id="service" name="service">
        <option value="consulting" data-en="Consulting">استشارات</option>
        <option value="development" data-en="Development">تطوير</option>
        <option value="other" data-en="Other">أخرى</option>
      </select>

      <label for="message" data-en="Your Message">رسالتك:</label>
      <textarea id="message" name="message" rows="4"
                placeholder="كيف يمكننا مساعدتك؟"
                data-en-placeholder="How can we help you?"></textarea>

      <button type="submit" data-en="Send Inquiry">إرسال الاستفسار</button>
    </form>

    <div id="responseMessage" class="success"
         role="status" aria-live="polite"></div>
  </section>

  <!-- Footer -->
  <footer>
    <p>
      © <span id="year">2024</span>
      <span data-en="Your Company. All rights reserved.">شركتك. جميع الحقوق محفوظة.</span>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
